version: '3.8'

services:
  sourcebuddy-redis:
    image: redis:6.2-alpine
    container_name: sourcebuddy-redis
    restart: unless-stopped
    networks:
      - sourcebuddy-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  sourcebuddy-qdrant:
    image: qdrant/qdrant:latest
    container_name: sourcebuddy-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    networks:
      - sourcebuddy-net
    healthcheck:
      test: ["CMD-SHELL", "timeout 5s bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  sourcebuddy-app:
    build:
      context: .
      dockerfile: ./AI_Sourcing_API/Dockerfile
    container_name: sourcebuddy-app
    restart: unless-stopped
    ports:
      - "8005:8005"
    environment:
      - REDIS_URL=redis://sourcebuddy-redis:6379/0
      - QDRANT_HOST=sourcebuddy-qdrant
      - QDRANT_PORT=6333
      - DOCKER_ENV=true
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    volumes:
      - ./AI_Sourcing_API:/app
      - ./AI_Sourcing_UI:/app/UI
      - ./model_cache:/app/model_cache
      - ./uploads:/app/uploads
    depends_on:
      sourcebuddy-redis:
        condition: service_healthy
      sourcebuddy-qdrant:
        condition: service_healthy
    networks:
      - sourcebuddy-net

  sourcebuddy-celery:
    build:
      context: .
      dockerfile: ./AI_Sourcing_API/Dockerfile
    container_name: sourcebuddy-celery
    restart: unless-stopped
    healthcheck:
      disable: true
    command: celery -A routers.celery_app worker --loglevel=info -P solo
    environment:
      - REDIS_URL=redis://sourcebuddy-redis:6379/0
      - QDRANT_HOST=sourcebuddy-qdrant
      - QDRANT_PORT=6333
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    volumes:
      - ./AI_Sourcing_API:/app
      - ./uploads:/app/uploads
      - ./model_cache:/app/model_cache
    depends_on:
      - sourcebuddy-redis
      - sourcebuddy-qdrant
    networks:
      - sourcebuddy-net

  sourcebuddy-chat-agent:
    build:
      context: ./conversational_agent_service
      dockerfile: Dockerfile
    container_name: sourcebuddy-chat-agent
    restart: unless-stopped
    network_mode: host
    environment:
      - MAIN_APP_URL=http://localhost:8005
      - LLM_PROVIDER=ollama
      - LLM_BASE_URL=http://localhost:11434
      - LLM_MODEL=llama3:8b
      - LLM_API_KEY=
      - ALLOWED_ORIGINS=*

networks:
  sourcebuddy-net:
    driver: bridge
